<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — L'Instant Réel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo" data-site-nom>L'Instant Réel</a>
        <nav>
            <a href="index.html#formules">Tarifs</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="section narrow">
        <p class="eyebrow center">Contact</p>
        <h1 class="page-title">Parlons de votre mariage</h1>

        <div class="card rdv-card">
            <h3>Réserver un appel découverte</h3>
            <p>Choisissez directement un créneau dans mon agenda.</p>
            <a href="#" data-rdv target="_blank" rel="noopener" class="btn btn-gold">Choisir un créneau</a>
        </div>

        <h2 class="form-title" id="form-title">Ou demandez un devis</h2>

        <form id="contact-form" class="card form">
            <label>Formule
                <select name="formule" id="c-formule"></select>
            </label>
            <label>Nom et prénom
                <input name="nom" required autocomplete="name">
            </label>
            <label>Téléphone
                <input name="tel" type="tel" autocomplete="tel">
            </label>
            <label>Date du mariage
                <input name="date" type="date">
            </label>
            <label>Lieu
                <input name="lieu" placeholder="Martinique, Guadeloupe, autre…">
            </label>
            <label>Message
                <textarea name="message" rows="4" placeholder="Vos envies, vos questions…"></textarea>
            </label>
            <div class="form-actions" id="c-actions"></div>
            <p class="form-note" id="c-note"></p>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 <span data-site-nom>L'Instant Réel</span> — Martinique</p>
        <p class="footer-links" id="footer-links"></p>
    </footer>

    <script src="config.js"></script>
    <script src="site.js"></script>
    <script>afficherContact();</script>
</body>
</html>
