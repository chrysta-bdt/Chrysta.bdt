<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devis ou rendez-vous — L'Instant Réel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo" data-site-nom>L'Instant Réel</a>
        <nav>
            <a href="index.html#formules">Formules</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="section narrow">
        <p class="eyebrow center">Contact</p>
        <h1 class="page-title">Demande de devis ou de rendez-vous</h1>

        <form id="contact-form" class="card form">
            <label>Formule
                <select name="formule" id="c-formule"></select>
            </label>
            <label>Je souhaite
                <select name="demande">
                    <option>Un devis</option>
                    <option>Un rendez-vous</option>
                </select>
            </label>
            <label>Nom et prénom
                <input name="nom" required autocomplete="name">
            </label>
            <label>Téléphone
                <input name="tel" type="tel" autocomplete="tel">
            </label>
            <label>Date de l'événement
                <input name="date" type="date">
            </label>
            <label>Message
                <textarea name="message" rows="4" placeholder="Type d'événement, lieu, questions…"></textarea>
            </label>
            <div class="form-actions" id="c-actions"></div>
            <p class="form-note" id="c-note"></p>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2026 <span data-site-nom>L'Instant Réel</span> — Martinique</p>
        <p class="footer-links" id="footer-links"></p>
    </footer>

    <script src="config.js"></script>
    <script src="site.js"></script>
    <script>afficherContact();</script>
</body>
</html>
