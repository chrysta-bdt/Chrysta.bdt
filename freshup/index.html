<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fresh Up — Nettoyage canapés, matelas et tapis à domicile en Martinique</title>
    <meta name="description" content="Nettoyage en profondeur de canapés, matelas, tapis et moquettes, à domicile partout en Martinique. Prix affichés, estimation immédiate, paiement sur place.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="page-accueil">
    <header class="navbar">
        <a href="index.html" class="logo"><img src="img/logo-couleur.png" alt="Fresh Up"></a>
        <a href="#" class="nav-tel" data-tel></a>
    </header>

    <main class="accueil">
        <div class="accueil-texte">
            <p class="eyebrow">Nettoyage à domicile · Martinique</p>
            <h1>Ta couleur préférée,<br><span>c'est le propre.</span></h1>
            <p class="lead">Canapés, matelas, tapis : on les nettoie en profondeur, chez toi. Fais glisser pour voir la différence.</p>
        </div>

        <div class="avant-apres" id="avant-apres" aria-label="Avant et après nettoyage">
            <div class="aa-couche aa-avant" id="aa-avant"></div>
            <div class="aa-couche aa-apres" id="aa-apres"></div>
            <span class="aa-label aa-label-avant">Avant</span>
            <span class="aa-label aa-label-apres">Après</span>
            <div class="aa-ligne" id="aa-ligne">
                <button type="button" class="aa-poignee" id="aa-poignee" role="slider" aria-label="Faire glisser avant / après" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>

        <div class="choix">
            <p class="choix-titre">Je veux nettoyer…</p>
            <div class="choix-boutons" id="choix-boutons"></div>
            <p class="choix-info" data-paiement></p>
        </div>
    </main>

    <footer class="footer">
        <p id="footer-links"></p>
    </footer>

    <script src="config.js"></script>
    <script src="site.js"></script>
</body>
</html>
